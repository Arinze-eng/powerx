name: Build iOS / iPad IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode scheme to build (e.g. MyApp)'
        required: true
        default: ''
      sdk:
        description: 'SDK: iphoneos (device, unsigned) or iphonesimulator'
        required: false
        default: 'iphonesimulator'
      configuration:
        description: 'Build configuration (Debug/Release)'
        required: false
        default: 'Release'
      artifact_glob:
        description: 'Glob for .app/.ipa outputs'
        required: false
        default: '**/*.app, **/*.ipa'
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_*.app/Contents/Developer
        shell: bash

      - name: Resolve dependencies (CocoaPods if present)
        if: hashFiles('Podfile') != ''
        run: |
          cd "$GITHUB_WORKSPACE"
          pod install
        shell: bash

      - name: Build .app for ${{ inputs.sdk }}
        run: |
          cd "$GITHUB_WORKSPACE"
          xcodebuild -workspace *.xcworkspace -scheme "${{ inputs.scheme }}" \
            -sdk ${{ inputs.sdk }} -configuration ${{ inputs.configuration }} \
            -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 \
            || xcodebuild -project *.xcodeproj -scheme "${{ inputs.scheme }}" \
            -sdk ${{ inputs.sdk }} -configuration ${{ inputs.configuration }} \
            -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO build
        shell: bash

      - name: Create IPA (device build only, unsigned)
        if: inputs.sdk == 'iphoneos'
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products -name "*.app" -maxdepth 3 | head -n1)
          echo "App found: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "No .app produced"; exit 1; fi
          mkdir -p Payload && cp -r "$APP_PATH" Payload/
          zip -ry unsigned.ipa Payload/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ inputs.artifact_glob }}
          if-no-files-found: error
          retention-days: 2