name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      build_command:
        description: 'Full command to produce the .exe (runs on windows-latest)'
        required: true
        default: 'py -m PyInstaller --onefile app.py'
      artifact_glob:
        description: 'Glob for EXE outputs relative to repo root'
        required: false
        default: 'dist/*.exe, build/**/*.exe, **/*.exe'
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: contains('${{ inputs.build_command }}', 'py ') || contains('${{ inputs.build_command }}', 'pip') || contains('${{ inputs.build_command }}', 'python')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        if: contains('${{ inputs.build_command }}', 'npm') || contains('${{ inputs.build_command }}', 'electron')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build command
        run: ${{ inputs.build_command }}
        shell: powershell

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: ${{ inputs.artifact_glob }}
          if-no-files-found: error
          retention-days: 2