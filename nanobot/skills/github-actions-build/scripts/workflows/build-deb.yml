name: Build DEB Package

on:
  workflow_dispatch:
    inputs:
      package_maintainer:
        description: 'Maintainer string for the .deb (Name <email>)'
        required: false
        default: 'NetHunter <builds@nethunter.example>'
      package_desc:
        description: 'Short one-line package description'
        required: false
        default: 'Generic package built via GitHub Actions.'
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect packaging setup
        id: setup
        run: |
          # Accept DEBIAN/ control dir, debian/ source layout, or a simple binary to wrap
          echo "control_dirs:"; ls -d DEBIAN debian 2>/dev/null || echo "none found"
          echo "---"; ls -la
        shell: bash

      - name: Install deb tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot || true
        shell: bash

      - name: Build DEB (dpkg-deb on a DEBIAN/ dir)
        if: ${{ hashFiles('DEBIAN/control') != '' }}
        run: |
          chmod -R 0755 DEBIAN/*
          dpkg-deb --build --root-owner-group . "$GITHUB_WORKSPACE/package.deb"
        shell: bash

      - name: Build DEB (dpkg-buildpackage on debian/ dir)
        if: ${{ hashFiles('debian/control') != '' && hashFiles('DEBIAN/control') == '' }}
        run: |
          dpkg-buildpackage -uc -us -b || true
          find .. -name '*.deb' -exec mv {} "$GITHUB_WORKSPACE/package.deb" \;
        shell: bash

      - name: Fallback — wrap ./usr tree into a DEB
        if: ${{ hashFiles('DEBIAN/control') == '' && hashFiles('debian/control') == '' }}
        run: |
          mkdir -p staging/DEBIAN
          cp -r usr staging/
          {
            echo "Package: nethunter-build"
            echo "Version: 1.0.0"
            echo "Architecture: all"
            echo "Maintainer: ${{ inputs.package_maintainer }}"
            echo "Description: ${{ inputs.package_desc }}"
          } > staging/DEBIAN/control
          chmod -R 0755 staging/DEBIAN
          dpkg-deb --build --root-owner-group staging "$GITHUB_WORKSPACE/package.deb"
        shell: bash

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: '*.deb'
          if-no-files-found: error
          retention-days: 2