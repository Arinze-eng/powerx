name: powerx_android
description: "PowerX — Android client for your self-hosted PowerX AI agent (WebView wrapper)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # WebView that loads the hosted PowerX WebUI (nanobot) and handles auth in-page.
  webview_flutter: ^4.10.0
  # Full-featured in-app browser engine for opening external links / file downloads.
  flutter_inappwebview: ^6.1.5
  # Download generated files from the agent into device storage.
  path_provider: ^2.1.4
  http: ^1.2.2
  open_filex: ^4.5.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
