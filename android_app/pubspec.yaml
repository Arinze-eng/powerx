name: powerx_android
description: "PowerX — native Android client for your self-hosted PowerX AI agent."
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking: REST (Supabase auth, sessions, thread history) + WebSocket chat.
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # Secure token storage (session persists across app restarts).
  flutter_secure_storage: ^9.2.2
  # Markdown rendering for assistant replies.
  flutter_markdown: ^0.7.3
  # State management across screens.
  provider: ^6.1.2
  # Open generated files / links.
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  intl: ^0.19.0
  # Pick images / arbitrary files for chat attachments.
  file_picker: ^8.1.2
  # Detect MIME types for base64 data-url encoding of images.
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
