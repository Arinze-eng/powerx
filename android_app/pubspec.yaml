name: powerx_android
description: "PowerX — native Android client for your self-hosted PowerX AI agent."
publish_to: 'none'

version: 1.5.0+11

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking: REST (Supabase auth, sessions, thread history) + WebSocket chat.
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # Secure token storage (session persists across app restarts).
  flutter_secure_storage: ^9.2.2
  # Markdown rendering for assistant replies.
  flutter_markdown: ^0.7.3
  # State management across screens.
  provider: ^6.1.2
  # Open generated files / links.
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  intl: ^0.19.0
  # Pick images / arbitrary files for chat attachments.
  file_picker: ^8.1.2
  # Detect MIME types for base64 data-url encoding of images.
  mime: ^1.0.6
  # Stable per-device fingerprint for the signup anti-abuse lock.
  device_info_plus: ^11.2.0
  crypto: ^3.0.3
  # Keep the screen on while a long task streams (up to ~1h turns).
  wakelock_plus: ^1.2.8
  # Voice notes: capture audio natively, then hand the bytes to the gateway's
  # transcription endpoint so speech becomes text in the composer.
  record: ^6.1.2
  permission_handler: ^11.3.1

dependency_overrides:
  # record's transitive Linux federated plugin must match the resolved
  # record_platform_interface major/minor. Without this override pub resolves
  # record_linux 0.7.2, which does not implement `startStream` and has a stale
  # `hasPermission` signature, so the Dart kernel snapshot fails to compile even
  # for Android builds (the host tool compiles every reachable plugin source).
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
