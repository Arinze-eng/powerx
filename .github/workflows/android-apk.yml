name: Build PowerX Android APK

# Builds a release APK of the PowerX WebView client and uploads it as an
# artifact. Runs on pushes/PRs that touch the android_app directory, and can be
# triggered manually from the Actions tab to produce a fresh APK on demand.

on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      powerx_url:
        description: 'PowerX backend base URL (leave blank for the default)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android_app/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android_app/android/**/*.gradle*', 'android_app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Install dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: android_app
        run: flutter analyze

      - name: Run tests
        working-directory: android_app
        run: flutter test

      - name: Build release APK
        working-directory: android_app
        env:
          POWERX_URL: ${{ github.event.inputs.powerx_url }}
        run: |
          if [ -n "$POWERX_URL" ]; then
            flutter build apk --release --dart-define=POWERX_URL="$POWERX_URL"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerx-android-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
