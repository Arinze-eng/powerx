services:
  - type: web
    name: novita-super-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://gemini-proxy.codebanana.app/v1
      - key: LLM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://minis-yzdb.onrender.com/telegram
      # Public base URL for the OpenAI-compatible API. On Render the reverse
      # proxy serves /v1/* on the same origin as the webhook (portless).
      - key: NANOBOT_API_PUBLIC_URL
        value: https://minis-yzdb.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_ORIGIN
        value: http://127.0.0.1:8081
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram
      - key: WEBUI_UPSTREAM
        value: http://127.0.0.1:8766
      - key: WEBUI_WS_UPSTREAM
        value: ws://127.0.0.1:8766
      - key: NOVITA_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://nisqfdwvwjbejgeurbol.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_AUTH_ENABLED
        value: "true"
      - key: SUPABASE_GATEWAY_KEY
        sync: false
      - key: NANOBOT_WEB_TOKEN
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PORT
        value: "8765"
      - key: NANOBOT_DATA_DIR
        value: /home/nanobot/.nanobot
      - key: NANOBOT_SANDBOX_TIMEOUT
        value: "3600"
